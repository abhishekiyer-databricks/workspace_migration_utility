[pytest]
# The offline suite is everything under tests/ EXCEPT the live harnesses, which need a real
# workspace (a `fvm1` / `target_ws` CLI profile) and mutate it. Those are run explicitly, e.g.
#   python3 -m tests.live_fvm1_export
# so a bare `python3 -m pytest` is always safe and offline.
testpaths = tests
python_files = test_*.py
addopts = -q
